name: Deploy VGES Demo Websites to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - '01-Aurelio-Barbershop/site/**'
      - '02-Mason-Elia/site/**'
      - '03-Fos-Photography/site/**'
      - '04-Nisa-Beauty/site/**'
      - '05-Areti-Medical/site/**'
      - '06-Lumen-Dental/site/**'
      - '07-Themis-Legal/site/**'
      - '08-Axia-Accounting/site/**'
      - '09-Pedia-Learning-Center/site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Force deploy all 9 websites (bypassing git diff)'
        required: true
        default: true
        type: boolean
      target_project:
        description: 'Specific project to deploy (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - 01-Aurelio-Barbershop
          - 02-Mason-Elia
          - 03-Fos-Photography
          - 04-Nisa-Beauty
          - 05-Areti-Medical
          - 06-Lumen-Dental
          - 07-Themis-Legal
          - 08-Axia-Accounting
          - 09-Pedia-Learning-Center

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Validate Cloudflare Secrets
        env:
          RAW_CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLEAN_TOKEN=$(printf "%s" "$RAW_CF_API_TOKEN" | tr -d '\r\n\t ')
          CLOUDFLARE_ACCOUNT_ID=$(printf "%s" "$RAW_CF_ACCOUNT_ID" | tr -d '\r\n\t ')

          # Extract 40-char token candidate if the secret is wrapped in curl/bearer text
          TOKEN_CANDIDATE=$(printf "%s" "$CLEAN_TOKEN" | grep -oE '[a-zA-Z0-9_-]{40}' | head -n 1)
          if [ -n "$TOKEN_CANDIDATE" ]; then
            CLOUDFLARE_API_TOKEN="$TOKEN_CANDIDATE"
            echo "🔍 Extracted 40-char token candidate from secret (length: ${#CLOUDFLARE_API_TOKEN})."
          else
            CLOUDFLARE_API_TOKEN="$CLEAN_TOKEN"
          fi

          export CLOUDFLARE_API_TOKEN
          export CLOUDFLARE_ACCOUNT_ID

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "❌ ERROR: GitHub Secret 'CLOUDFLARE_API_TOKEN' is missing."
            echo "Please configure it in: Repository Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "❌ ERROR: GitHub Secret 'CLOUDFLARE_ACCOUNT_ID' is missing."
            echo "Please configure it in: Repository Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          echo "✅ Cloudflare secrets verified (Token length: ${#CLOUDFLARE_API_TOKEN}, Account ID length: ${#CLOUDFLARE_ACCOUNT_ID})."

          echo "🔍 Verifying token with Cloudflare API (/user/tokens/verify)..."
          VERIFY_OUTPUT=$(curl -s -w "\n%{http_code}" -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          HTTP_STATUS=$(echo "$VERIFY_OUTPUT" | tail -n 1)
          BODY=$(echo "$VERIFY_OUTPUT" | head -n -1)

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Cloudflare token successfully verified (HTTP 200, Active)."
          else
            echo "⚠️ Cloudflare token verification returned HTTP $HTTP_STATUS:"
            echo "$BODY" | jq -c '{success: .success, errors: .errors}' 2>/dev/null || echo "Response: $BODY"
          fi

      - name: Detect Changes and Deploy
        env:
          RAW_CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ inputs.target_project }}
          INPUT_DEPLOY_ALL: ${{ inputs.deploy_all }}
        run: |
          CLEAN_TOKEN=$(printf "%s" "$RAW_CF_API_TOKEN" | tr -d '\r\n\t ')
          CLOUDFLARE_ACCOUNT_ID=$(printf "%s" "$RAW_CF_ACCOUNT_ID" | tr -d '\r\n\t ')

          TOKEN_CANDIDATE=$(printf "%s" "$CLEAN_TOKEN" | grep -oE '[a-zA-Z0-9_-]{40}' | head -n 1)
          if [ -n "$TOKEN_CANDIDATE" ]; then
            CLOUDFLARE_API_TOKEN="$TOKEN_CANDIDATE"
          else
            CLOUDFLARE_API_TOKEN="$CLEAN_TOKEN"
          fi

          export CLOUDFLARE_API_TOKEN
          export CLOUDFLARE_ACCOUNT_ID

          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"
          echo "Event: ${{ github.event_name }}"

          FORCE_ALL=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$INPUT_DEPLOY_ALL" = "true" ]; then
            FORCE_ALL=true
            echo "⚡ Manual dispatch with deploy_all=true -> Deploying all websites."
          elif echo "$COMMIT_MSG" | grep -qi "\[deploy[ -]all\]"; then
            FORCE_ALL=true
            echo "⚡ Commit message contains [deploy all] -> Deploying all websites."
          fi

          if [ "$FORCE_ALL" = true ]; then
            CHANGED="ALL"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD || echo "ALL")
          fi

          echo "Target input: $TARGET"
          echo "Changed files mode: $CHANGED"

          deploy_site() {
            DIR="$1"
            PROJECT="$2"

            if [ ! -d "$DIR" ]; then
              echo "⏭️ Directory $DIR does not exist. Skipping."
              return 0
            fi

            SHOULD_DEPLOY=false
            if [ "$TARGET" = "all" ] || [ "$TARGET" = "$DIR" ] || [ "$TARGET" = "" ]; then
              if [ "$FORCE_ALL" = true ] || [ "$CHANGED" = "ALL" ] || echo "$CHANGED" | grep -q "^$DIR/"; then
                SHOULD_DEPLOY=true
              fi
            fi

            if [ "$SHOULD_DEPLOY" = true ]; then
              echo "--------------------------------------------------------"
              echo "🚀 Ensuring Cloudflare Pages project $PROJECT exists..."
              wrangler pages project create "$PROJECT" --production-branch main || true

              echo "🚀 Deploying $DIR to Cloudflare Pages project: $PROJECT..."
              wrangler pages deploy "$DIR" --project-name "$PROJECT" --branch main --commit-dirty=true
              echo "✅ Successfully deployed $PROJECT"
            else
              echo "⏭️ No changes in $DIR. Skipping."
            fi
          }

          deploy_site "01-Aurelio-Barbershop/site" "vges-aurelio"
          deploy_site "02-Mason-Elia/site" "vges-mason-elia"
          deploy_site "03-Fos-Photography/site" "vges-fos-photography"
          deploy_site "04-Nisa-Beauty/site" "vges-nisa-beauty"
          deploy_site "05-Areti-Medical/site" "vges-areti-medical"
          deploy_site "06-Lumen-Dental/site" "vges-lumen-dental"
          deploy_site "07-Themis-Legal/site" "vges-themis-legal"
          deploy_site "08-Axia-Accounting/site" "vges-axia-accounting"
          deploy_site "09-Pedia-Learning-Center/site" "vges-pedia-learning"
