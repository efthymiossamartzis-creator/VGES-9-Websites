<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="warm-blush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5F0"/>
      <stop offset="60%" stop-color="#F2E6DF"/>
      <stop offset="100%" stop-color="#E5D3C8"/>
    </linearGradient>
    <linearGradient id="plum-soft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A5A6D"/>
      <stop offset="100%" stop-color="#5B3847"/>
    </linearGradient>
    <linearGradient id="clay-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B88C72"/>
      <stop offset="100%" stop-color="#D4AA92"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="#EFE4DF"/>
  <!-- Wall Arch Niche -->
  <path d="M300,550 V200 C300,110 365,40 450,40 C535,40 600,110 600,200 V550 Z" fill="#FAF5F0"/>
  <!-- Artisan Ceramic Vessel in Niche -->
  <path d="M410,500 C400,420 380,360 450,360 C520,360 500,420 490,500 Z" fill="url(#clay-grad)"/>
  <ellipse cx="450" cy="500" rx="40" ry="10" fill="#A0745C"/>
  <!-- Dried delicate floral branch -->
  <path d="M450,360 Q480,240 520,180" stroke="#714859" stroke-width="2" fill="none" opacity="0.7"/>
  <circle cx="520" cy="180" r="5" fill="#714859" opacity="0.8"/>
  <circle cx="490" cy="210" r="4" fill="#714859" opacity="0.6"/>
  <!-- Floor shadow line -->
  <line x1="100" y1="550" x2="800" y2="550" stroke="#D8C8BE" stroke-width="3"/>

</svg>