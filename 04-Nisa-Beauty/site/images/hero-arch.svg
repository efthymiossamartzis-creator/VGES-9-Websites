<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="warm-blush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5F0"/>
      <stop offset="60%" stop-color="#F2E6DF"/>
      <stop offset="100%" stop-color="#E5D3C8"/>
    </linearGradient>
    <linearGradient id="plum-soft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A5A6D"/>
      <stop offset="100%" stop-color="#5B3847"/>
    </linearGradient>
    <linearGradient id="clay-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B88C72"/>
      <stop offset="100%" stop-color="#D4AA92"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#warm-blush)"/>
  <!-- Elegant Arch Frame -->
  <path d="M120,950 V360 C120,180 245,60 400,60 C555,60 680,180 680,360 V950 Z" fill="#EFE4DF" stroke="#B88C72" stroke-width="2"/>
  <path d="M150,950 V370 C150,210 260,100 400,100 C540,100 650,210 650,370 V950 Z" fill="url(#plum-soft)" opacity="0.9"/>
  <!-- Minimalist Botanical Silhouette -->
  <g fill="none" stroke="#FAF5F0" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M400,850 Q400,500 400,280"/>
    <!-- Leaves -->
    <path d="M400,680 Q320,640 280,590 Q340,580 400,630" fill="#FAF5F0" opacity="0.25"/>
    <path d="M400,580 Q480,540 520,490 Q460,480 400,530" fill="#FAF5F0" opacity="0.25"/>
    <path d="M400,480 Q330,440 300,390 Q360,380 400,430" fill="#FAF5F0" opacity="0.25"/>
    <path d="M400,380 Q470,340 490,290 Q440,290 400,340" fill="#FAF5F0" opacity="0.25"/>
    <!-- Top delicate bud -->
    <circle cx="400" cy="270" r="10" fill="#FAF5F0" opacity="0.9"/>
  </g>
  <!-- Gentle Sun Circle -->
  <circle cx="560" cy="240" r="80" fill="#B88C72" opacity="0.3"/>

</svg>