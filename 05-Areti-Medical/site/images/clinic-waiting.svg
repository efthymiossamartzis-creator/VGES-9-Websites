      <stop offset="0%" stop-color="#286957"/>
      <stop offset="100%" stop-color="#193D35"/>
    </linearGradient>
    <linearGradient id="soft-bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6FAF8"/>
      <stop offset="100%" stop-color="#E3EEE7"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#soft-bg-grad)"/>
  <!-- Window with soft daylight -->
  <rect x="120" y="80" width="300" height="340" rx="10" fill="#FFFFFF" stroke="#D1E2D8" stroke-width="2"/>
