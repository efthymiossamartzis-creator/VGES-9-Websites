<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F8FA"/>
      <stop offset="100%" stop-color="#EBF1FA"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#24303F" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Main Ledger Card -->
  <g filter="url(#shadow)">
    <rect x="80" y="60" width="640" height="480" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Ledger Header Bar -->
    <rect x="80" y="60" width="640" height="64" rx="12" fill="#2452A1"/>
    <rect x="80" y="104" width="640" height="20" fill="#2452A1"/> <!-- Square off bottom of header -->

    <circle cx="114" cy="92" r="6" fill="#DCE5F3" opacity="0.6"/>
    <circle cx="132" cy="92" r="6" fill="#DCE5F3" opacity="0.6"/>
    <circle cx="150" cy="92" r="6" fill="#DCE5F3" opacity="0.6"/>

    <text x="200" y="97" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">AXIA FINANCIAL STRUCTURE // INDEX</text>

    <!-- Column Headers -->
    <rect x="80" y="124" width="640" height="42" fill="#F7F8FA" stroke="#E2E8F0" stroke-width="1"/>
    <text x="120" y="150" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#5A6A80">CODE</text>
    <text x="210" y="150" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#5A6A80">ΕΝΟΤΗΤΑ</text>
    <text x="440" y="150" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#5A6A80">ΠΕΡΙΓΡΑΦΗ ΡΟΗΣ</text>
    <text x="630" y="150" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#5A6A80">ΚΑΤΑΣΤΑΣΗ</text>

    <!-- Row 1 -->
    <g>
      <rect x="80" y="166" width="640" height="82" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
      <rect x="115" y="186" width="48" height="24" rx="4" fill="#DCE5F3"/>
      <text x="128" y="202" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#2452A1">01</text>
      <text x="210" y="198" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#24303F">Λογιστική Οργάνωση</text>
      <text x="210" y="218" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Τήρηση και συστηματικός έλεγχος</text>
      <line x1="440" y1="205" x2="570" y2="205" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
      <line x1="440" y1="205" x2="520" y2="205" stroke="#2452A1" stroke-width="6" stroke-linecap="round"/>
      <rect x="620" y="188" width="76" height="22" rx="11" fill="#EBF3FF"/>
      <text x="634" y="203" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#2452A1">ΕΝΕΡΓΟ</text>
    </g>

    <!-- Row 2 -->
    <g>
      <rect x="80" y="248" width="640" height="82" fill="#FAFCFF" stroke="#F1F5F9" stroke-width="1"/>
      <rect x="115" y="268" width="48" height="24" rx="4" fill="#DCE5F3"/>
      <text x="128" y="284" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#2452A1">02</text>
      <text x="210" y="280" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#24303F">Φορολογική Υποστήριξη</text>
      <text x="210" y="300" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Καθοδήγηση και ορθή αποτύπωση</text>
      <line x1="440" y1="287" x2="570" y2="287" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
      <line x1="440" y1="287" x2="545" y2="287" stroke="#2452A1" stroke-width="6" stroke-linecap="round"/>
      <rect x="620" y="270" width="76" height="22" rx="11" fill="#EBF3FF"/>
      <text x="634" y="285" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#2452A1">ΕΝΕΡΓΟ</text>
    </g>

    <!-- Row 3 -->
    <g>
      <rect x="80" y="330" width="640" height="82" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
      <rect x="115" y="350" width="48" height="24" rx="4" fill="#DCE5F3"/>
      <text x="128" y="366" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#2452A1">03</text>
      <text x="210" y="362" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#24303F">Μισθοδοσία</text>
      <text x="210" y="382" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Οργάνωση εργασιακών δεδομένων</text>
      <line x1="440" y1="369" x2="570" y2="369" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
      <line x1="440" y1="369" x2="505" y2="369" stroke="#2452A1" stroke-width="6" stroke-linecap="round"/>
      <rect x="620" y="352" width="76" height="22" rx="11" fill="#EBF3FF"/>
      <text x="634" y="367" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#2452A1">ΕΝΕΡΓΟ</text>
    </g>

    <!-- Row 4 -->
    <g>
      <rect x="80" y="412" width="640" height="82" fill="#FAFCFF" stroke="#F1F5F9" stroke-width="1"/>
      <rect x="115" y="432" width="48" height="24" rx="4" fill="#DCE5F3"/>
      <text x="128" y="448" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#2452A1">04</text>
      <text x="210" y="444" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#24303F">Έναρξη Δραστηριότητας</text>
      <text x="210" y="464" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Προγραμματισμός πρώτων βημάτων</text>
      <line x1="440" y1="451" x2="570" y2="451" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
      <line x1="440" y1="451" x2="530" y2="451" stroke="#2452A1" stroke-width="6" stroke-linecap="round"/>
      <rect x="620" y="434" width="76" height="22" rx="11" fill="#EBF3FF"/>
      <text x="634" y="449" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#2452A1">ΕΝΕΡΓΟ</text>
    </g>

    <!-- Footer Summary of Graphic -->
    <rect x="80" y="494" width="640" height="46" rx="12" fill="#F1F5F9"/>
    <text x="115" y="522" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">ΣΥΝΟΛΟ ΕΝΔΕΙΚΤΙΚΩΝ ΡΟΩΝ: 4 ΚΑΤΗΓΟΡΙΕΣ</text>
    <text x="590" y="522" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#2452A1">100% STRUCTURED</text>
  </g>
</svg>
