<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogGrad)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="16" height="630" fill="#2452A1"/>

  <!-- Brand badge -->
  <rect x="100" y="80" width="220" height="38" rx="6" fill="#DCE5F3"/>
  <text x="116" y="105" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#2452A1" letter-spacing="1.5">ΣΧΕΔΙΑΣΤΙΚΟ DEMO</text>

  <!-- Title -->
  <text x="100" y="190" font-family="Arial, sans-serif" font-size="54" font-weight="900" fill="#24303F" letter-spacing="-1">AXIA ACCOUNTING</text>
  <text x="100" y="240" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2452A1">Οργάνωση που δίνει καθαρή εικόνα.</text>

  <!-- Description -->
  <text x="100" y="310" font-family="Arial, sans-serif" font-size="20" fill="#4B5563">Λογιστικές και φορολογικές υπηρεσίες σε μια δομημένη ψηφιακή παρουσία.</text>
  <text x="100" y="345" font-family="Arial, sans-serif" font-size="20" fill="#4B5563">Έμφαση στην κατανόηση και στα ξεκάθαρα επόμενα βήματα.</text>

  <!-- Numbered ledger indicators -->
  <g transform="translate(100, 420)">
    <!-- 01 -->
    <rect x="0" y="0" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="20" y="35" font-family="'Courier New', monospace" font-size="18" font-weight="700" fill="#2452A1">01.</text>
    <text x="60" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#24303F">Λογιστική</text>
    <text x="20" y="65" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Τήρηση &amp; έλεγχος</text>

    <!-- 02 -->
    <rect x="250" y="0" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="270" y="35" font-family="'Courier New', monospace" font-size="18" font-weight="700" fill="#2452A1">02.</text>
    <text x="310" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#24303F">Φορολογικά</text>
    <text x="270" y="65" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Συνέπεια &amp; πλάνο</text>

    <!-- 03 -->
    <rect x="500" y="0" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="520" y="35" font-family="'Courier New', monospace" font-size="18" font-weight="700" fill="#2452A1">03.</text>
    <text x="560" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#24303F">Μισθοδοσία</text>
    <text x="520" y="65" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Οργάνωση εργασίας</text>

    <!-- 04 -->
    <rect x="750" y="0" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="770" y="35" font-family="'Courier New', monospace" font-size="18" font-weight="700" fill="#2452A1">04.</text>
    <text x="810" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#24303F">Έναρξη</text>
    <text x="770" y="65" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Πρώτα βήματα</text>
  </g>

  <!-- Watermark footer -->
  <text x="100" y="580" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#94A3B8">VGES ONLINE WEBSITES &bull; PORTFOLIO DEMO</text>
</svg>
